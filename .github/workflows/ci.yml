name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check demo files exist
        run: |
          test -f index.html
          test -f demo-plato-client.html
          test -f demo-fleet-murmur.html
          test -f demo-fleet-spread.html
          echo "All demo HTML files present"
